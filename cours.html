<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kurso – Mes cours</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#1c1c1c">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <a class="side__logo" href="guest.html"><img src="kurso.png" alt="Kurso" width="273" height="56"></a>
      <nav class="side__nav" aria-label="Navigation principale">
        <a href="guest.html">Accueil</a>
        <a href="cours.html" aria-current="page">Mes cours</a>
        <a href="importer.html">Importer</a>
        <a href="revisions.html">Révisions</a>
        <a href="reviser.html">À réviser</a>
        <a href="agenda.html">Agenda</a>
        <a href="focus.html">Focus</a>
        <a href="tableau.html">Tableau</a>
        <a href="noeuds.html">Nœuds</a>
        <a href="reglages.html">Réglages</a>
      </nav>
      <div class="side__foot">
        <span>Mode invité</span>
        <a href="login.html">Se déconnecter</a>
      </div>
    </aside>

    <main class="main">
      <header class="page-head">
        <div>
          <h1>Mes cours</h1>
          <p class="lead">Clique sur un cours pour voir ses informations, l’aperçu du fichier et le modifier.</p>
        </div>
        <div class="page-actions">
          <a class="btn" href="importer.html">Importer un cours</a>
        </div>
      </header>

      <div class="toolbar">
        <input class="input" id="search" type="search" placeholder="Rechercher un titre, un chapitre…" aria-label="Rechercher un cours" autocomplete="off">
        <select class="select" id="filter-ext" aria-label="Format">
          <option value="all">Tous les formats</option>
          <option value="pdf">PDF</option>
          <option value="png">PNG</option>
          <option value="txt">TXT</option>
        </select>
        <select class="select" id="filter-mastery" aria-label="Niveau de maîtrise">
          <option value="all">Tous les niveaux</option>
          <option value="todo">À apprendre</option>
          <option value="learning">En cours</option>
          <option value="done">Maîtrisé</option>
        </select>
        <label class="check" style="margin:0"><input type="checkbox" id="filter-fav"><span>Favoris ★</span></label>
        <select class="select" id="sort" aria-label="Trier par">
          <option value="recent">Ajoutés récemment</option>
          <option value="date">Date du cours</option>
          <option value="title">Titre (A à Z)</option>
          <option value="subject">Matière</option>
        </select>
      </div>

      <div class="chips" id="chips" role="group" aria-label="Filtrer par matière"></div>
      <p class="note note--block" id="count" role="status"></p>
      <div id="list"></div>
    </main>
  </div>

  <script src="core.js"></script>
  <script src="study.js"></script>
  <script src="courses.js"></script>
</body>
</html>
